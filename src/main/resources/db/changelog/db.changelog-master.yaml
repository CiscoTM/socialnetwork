databaseChangeLog:

  - include:
      file: db/changelog/changeset/create-posts-table.yaml

  - changeSet:
      id: create-users-table
      author: francisco
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: display_name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uq_users_email

  - include:
      file: db/changelog/changeset/create-interactions-tables.yaml
