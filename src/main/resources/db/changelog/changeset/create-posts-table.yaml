databaseChangeLog:
  - changeSet:
      id: create-posts-table
      author: francisco
      changes:
        - createTable:
            tableName: posts
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: author_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
