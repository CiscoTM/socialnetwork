# ANEXO 23-A ? Configuración Testcontainers + Podman (Fedora 43)

# Ruta típica del socket de Podman rootless en Fedora (ajusta si es necesario)
docker.host=unix:///run/user/1000/podman/podman.sock

# Desactivar Ryuk (ya lo haces por env en CI, aquí lo dejamos fijo para local)
ryuk.disabled=true

# Desactivar checks adicionales (útil en entornos Podman/Fedora)
checks.disable=true

# Reutilización de contenedores (opcional, mejora velocidad en local)
testcontainers.reuse.enable=true
