version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: sociannetwork.db
    environment:
      POSTGRES_DB: backend_social_network
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d backend_social_network" ]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build: .
    container_name: socialnetwork-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/backend_social_network
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8080:8080"

